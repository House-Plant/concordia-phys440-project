[build-system]
requires = ["uv_build==0.11.19"]
build-backend = "uv_build"

[project]
name = "concordia-phys440-project"
version = "0.1.0"
description = "Concordia PHYS 440 modelling project"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.5.4",
]

[dependency-groups]
dev = ["pre-commit>=4,<5", "pytest>=8,<10", "pyyaml>=6,<7", "ruff>=0.11,<1"]

[tool.uv.build-backend]
module-name = "modelling"

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["results"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
# Allow imports kept for exploratory scripts and notebook work.
ignore = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests", "tools/tests"]
addopts = "-ra --import-mode=importlib"
