name: Project checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: '0.11.19'
          enable-cache: false
      - name: Install project Python
        run: uv python install
      - name: Install locked environment
        run: uv sync --locked
      - name: Lock consistency, Ruff, and offline tests
        run: uv run --locked python tools/run_checks.py
